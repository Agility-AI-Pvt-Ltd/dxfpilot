# CadPilot stack: PostgreSQL + API + web, behind a Caddy gateway.
#
#   Local development (API and web run on your machine):  docker compose up -d db
#   Full stack (EC2 / production-like):                   docker compose up -d --build
#
# Settings and secrets come from ./.env (see .env.example). It is never committed or synced.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: cadpilot
      POSTGRES_DB: cadpilot
      # The development default only works locally; the deploy job refuses to run with it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadpilot}
    ports:
      # Loopback only: reachable from this machine (local dev), never from the network.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadpilot -d cadpilot"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cadpilot:${POSTGRES_PASSWORD:-cadpilot}@db:5432/cadpilot
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-cadpilot}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      # CRM integration (docs/CRM_INTEGRATION.md); off while CADPILOT_CRM_API_KEY is empty
      CADPILOT_PUBLIC_URL: ${CADPILOT_PUBLIC_URL:-}
      CADPILOT_CRM_API_KEY: ${CADPILOT_CRM_API_KEY:-}
      CADPILOT_CRM_WEBHOOK_SECRET: ${CADPILOT_CRM_WEBHOOK_SECRET:-}
      CADPILOT_CORS_ORIGINS: ${CADPILOT_CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""  # same origin via the gateway
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data  # TLS certificates when SITE_ADDRESS is a domain
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
