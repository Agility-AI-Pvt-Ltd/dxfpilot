services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: cadpilot
      POSTGRES_PASSWORD: cadpilot
      POSTGRES_DB: cadpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadpilot -d cadpilot"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
