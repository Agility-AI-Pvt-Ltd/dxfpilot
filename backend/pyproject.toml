[project]
name = "cadpilot"
version = "0.1.0"
description = "Autonomous first-draft P&ID engineering system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "langgraph>=0.2",
    "python-multipart>=0.0.9",
    "openai>=3.15.0",
    "python-dotenv>=1.2.3",
    "psycopg[binary,pool]>=3.2",
    "ezdxf>=1.3",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cadpilot*"]

[tool.setuptools.package-data]
cadpilot = ["standards/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
