# Process templates: the process knowledge the Process Agent starts from.
# A template is an ordered list of stages. Stages in the same train group are connected 1:1
# per train; a change of group (e.g. 2 reception lines -> 3 silos) is joined through a header.
# `match` lists keywords that must ALL appear in an equipment row description of the design data.

templates:
  milk_reception_to_pasteurization:
    name: Milk reception to pasteurization
    keywords: [reception, pasteuri, raw milk, silo, rmst, tanker]
    areas:
      "1": Milk reception & raw milk storage
      "2": Milk processing
    groups:
      # lead_stage sets the number of parallel units; flow_stage (the pump) sets each train's design flow
      reception: {lead_stage: unloading_pump, flow_stage: unloading_pump, default_count: 2}
      storage: {lead_stage: raw_milk_silo, default_count: 3}
      processing: {lead_stage: pasteurizer, flow_stage: raw_milk_transfer_pump, default_count: 2}
    stages:
      - id: tanker_inlet
        name: Road milk tanker unloading point
        kind: terminal_in
        group: reception
        area: "1"
        label: FROM ROAD MILK TANKER
        outlet_service: RM
        function: Battery limit — tanker unloading hose connection

      - id: reception_strainer
        name: Reception duplex strainer
        kind: equipment
        equipment_type: duplex_strainer
        group: reception
        area: "1"
        match: [inline strainer, manual changeover]
        default_capacity: {value: 40, unit: KLPH}
        function: Remove extraneous matter from received milk

      - id: deaerator
        name: Milk de-aeration vessel
        kind: equipment
        equipment_type: deaeration_vessel
        group: reception
        area: "1"
        optional: true
        match: [de-aeration vessel]
        default_capacity: {value: 200, unit: L}
        function: Remove entrained air ahead of volumetric metering

      - id: unloading_pump
        name: Tanker unloading pump
        kind: equipment
        equipment_type: centrifugal_pump
        group: reception
        area: "1"
        match: [tanker unloading pump]
        default_capacity: {value: 40, unit: KLPH}
        attributes: {drive: VFD}
        function: Unload milk from road tanker

      - id: raw_milk_chiller
        name: Raw milk chiller
        kind: equipment
        equipment_type: plate_heat_exchanger
        group: reception
        area: "1"
        optional: true
        match: [raw milk chiller]
        default_capacity: {value: 40, unit: KLPH}
        attributes: {duty: "10 → 4 °C", utility: chilled water}
        function: Chill received milk to storage temperature

      - id: raw_milk_silo
        name: Raw milk storage silo (RMST)
        kind: equipment
        equipment_type: silo
        group: storage
        area: "1"
        match: [raw milk storage silo]
        default_capacity: {value: 100, unit: KL}
        function: Store chilled raw milk

      - id: raw_milk_transfer_pump
        name: Raw milk transfer pump
        kind: equipment
        equipment_type: centrifugal_pump
        group: processing
        area: "2"
        match: [raw milk transfer pump]
        default_capacity: {value: 20, unit: KLPH}
        attributes: {drive: VFD}
        function: Feed raw milk from RMST to pasteurizer

      - id: process_strainer
        name: Pasteurizer feed duplex strainer
        kind: equipment
        equipment_type: duplex_strainer
        group: processing
        area: "2"
        match: [inline strainer, pasteurizer]
        default_capacity: {value: 20, unit: KLPH}
        function: Protect separator and pasteurizer

      - id: separator
        name: Self-cleaning separator with standardization
        kind: equipment
        equipment_type: centrifugal_separator
        group: processing
        area: "2"
        optional: true
        match: [centrifuge]
        default_capacity: {value: 20, unit: KLPH}
        outlet_service: SM
        function: Clarify, skim and standardize milk fat

      - id: pasteurizer
        name: Milk pasteurizer (HTST PHE)
        kind: equipment
        equipment_type: pasteurizer
        group: processing
        area: "2"
        match: [milk pasteurizer]
        default_capacity: {value: 20, unit: KLPH}
        outlet_service: PM
        attributes: {holding: "72 °C / 15 s"}
        function: HTST pasteurization with regeneration and holding tube

      - id: pmst_outlet
        name: To pasteurized milk storage
        kind: terminal_out
        group: processing
        area: "2"
        label: TO PASTEURIZED MILK STORAGE (PMST)
        function: Battery limit — pasteurized milk to PMST

services:
  RM: {name: Raw milk, fluid: raw milk}
  SM: {name: Standardized milk, fluid: standardized milk}
  PM: {name: Pasteurized milk, fluid: pasteurized milk}
