# Piping rules applied deterministically by the Topology Agent and checked by the Validator.

sizing:
  target_velocity_m_s: 1.5
  max_velocity_m_s: 2.5
  dn_series: [25, 40, 50, 65, 80, 100, 125, 150, 200, 250]
  # services that are not milk-like liquids (engineering modules)
  services:
    ST: {density_kg_m3: 5.2, target_velocity_m_s: 25, max_velocity_m_s: 35, flow_unit: kg/h}   # saturated steam ~10 bar(g)
    CON: {flow_unit: kg/h}                                        # condensate
    BFW: {flow_unit: kg/h}                                        # boiler feed water
    PKD: {size: false}                                            # packed product (conveyor, not a pipe)

spec:
  default: S1
  description: "S1 — SS316L sanitary tube, orbital welded, CIP-able"
  by_service:
    ST: S3        # carbon steel, IBR, insulated
    CON: S4       # carbon steel, insulated
    BFW: S4
    HWS: S5       # MS / GI, insulated
    HWR: S5
    CHWS: S5
    CHWR: S5
    CHM: S6       # PP / PVDF chemical line
    PKD: "-"

valves:
  - id: LR-PUMP-SUCTION
    applies_to: pump_suction
    type: butterfly_valve
    class: manual
    position: 0.75
    rationale: Suction isolation so the pump can be maintained without draining the upstream system.

  - id: LR-PUMP-DISCHARGE-NRV
    applies_to: pump_discharge
    type: check_valve
    class: manual
    position: 0.15
    rationale: Non-return valve prevents back-flow through the stopped pump.

  - id: LR-PUMP-DISCHARGE-ISO
    applies_to: pump_discharge
    type: butterfly_valve
    class: manual
    position: 0.3
    rationale: Discharge isolation for pump maintenance.

  - id: LR-MANIFOLD-ROUTE
    # product manifolds only: steam, condensate and water mains are isolated, not routed
    applies_to: {header_branch: true, not_service: [ST, CON, BFW, HWS, HWR, CHWS, CHWR]}
    type: on_off_valve
    class: automated
    position: 0.5
    rationale: Automated route valve selects which unit is filled/emptied from the manifold.

  - id: LR-BYPASS
    applies_to: bypass
    type: butterfly_valve
    class: manual
    position: 0.5
    rationale: Normally-closed bypass valve, requested by reviewer.
